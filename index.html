<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Digital Wallet</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Optional: Styling for Apple/Google Wallet buttons -->
  <style>
    .apple-btn, .google-btn {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .apple-btn {
      background: #2563eb;
      color: white;
    }

    .google-btn {
      background: #ea4335;
      color: white;
    }

    .apple-btn:hover {
      background: #1d4ed8;
    }

    .google-btn:hover {
      background: #c53030;
    }
  </style>
</head>

<body>
  <header>
    <h1>Amber's Digital Wallet</h1>
    <p>Identity • Badges • Credentials</p>
  </header>

  <main>
    <section id="profile">
      <h2>My Profile</h2>
      <div class="card">
        <p><strong>Name:</strong> <span id="profile-name">Amber Lewis</span></p>
        <p><strong>Email:</strong> <span id="profile-email">amber@example.com</span></p>
        <p><strong>User ID:</strong> <span id="profile-id"></span></p>
      </div>
    </section>

    <section id="badges">
      <h2>My Badges</h2>
      <div id="badge-list" class="grid"></div>
    </section>

    <section id="issue-badge">
      <h2>Issue New Badge</h2>
      <div class="card">
        <label>
          Badge Name:
          <input type="text" id="badge-name" placeholder="e.g. Wellness Streak 7 Days" />
        </label>
        <label>
          Description:
          <input type="text" id="badge-desc" placeholder="Short description" />
        </label>
        <button id="issue-btn">Issue Badge</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Prototype digital wallet • Built in VS Code</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
